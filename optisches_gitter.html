<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optisches Gitter – Interaktives Labor</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17243b;
    --muted: #66748b;
    --line: #dfe6ef;
    --paper: #ffffff;
    --bg: #f3f6fb;
    --blue: #315fe8;
    --blue-soft: #edf2ff;
    --orange: #e28a35;
    --green: #168a75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  .page { max-width: 1400px; margin: 0 auto; padding: 30px 24px 36px; }
  header { margin-bottom: 22px; }
  h1 { font-size: clamp(1.8rem, 3vw, 2.7rem); line-height: 1.1; margin: 0 0 10px; letter-spacing: -.035em; }
  .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px rgba(27, 45, 77, .045); }
  .controls { padding: 22px; }
  .panel-heading { font-size: 1rem; margin: 0 0 5px; letter-spacing: -.01em; }
  .control { margin: 0 0 23px; }
  .control:last-of-type { margin-bottom: 18px; }
  .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  label { font-size: .92rem; font-weight: 700; }
  output { color: var(--blue); font-variant-numeric: tabular-nums; font-weight: 800; font-size: .97rem; white-space: nowrap; }
  input[type="range"] { display: block; width: 100%; accent-color: var(--blue); cursor: pointer; }
  .main-panel { overflow: hidden; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 24px 14px; }
  .chart-head h2 { margin: 0 0 5px; font-size: 1.16rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 0 24px 12px; font-size: .84rem; color: #47566e; }
  .legend-item { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 25px; height: 0; border-top: 3px solid var(--blue); border-radius: 2px; }
  .swatch.envelope { border-color: var(--orange); border-top-style: dashed; }
  .chart-wrap { width: 100%; padding: 0 12px 4px; }
  canvas { display: block; width: 100%; height: 455px; }
  @media (max-width: 930px) {
    .layout { grid-template-columns: 1fr; }
    .controls { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 24px; }
    .control { margin-bottom: 18px; }
  }
  @media (max-width: 600px) {
    .page { padding: 22px 12px 28px; }
    .controls { display: block; padding: 18px; }
    .chart-head { padding: 18px 16px 12px; }
    .legend { padding: 0 16px 12px; gap: 12px; }
    .chart-wrap { padding: 0 2px; }
    canvas { height: 350px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Beugung am optischen Gitter</h1>
  </header>

  <main class="layout">
    <section class="panel controls" aria-label="Parameter einstellen">
      <h2 class="panel-heading">Versuchsparameter</h2>

      <div class="control">
        <div class="label-row"><label for="width">Spaltbreite <i>a</i></label><output id="widthOut" for="width">10,0 µm</output></div>
        <input id="width" type="range" min="2" max="20" step="0.5" value="10">
      </div>

      <div class="control">
        <div class="label-row"><label for="wavelength">Wellenlänge <i>λ</i></label><output id="wavelengthOut" for="wavelength">550 nm</output></div>
        <input id="wavelength" type="range" min="380" max="750" step="1" value="550">
      </div>

      <div class="control">
        <div class="label-row"><label for="spacing">Gitterkonstante <i>d</i></label><output id="spacingOut" for="spacing">50 µm</output></div>
        <input id="spacing" type="range" min="20" max="100" step="1" value="50">
      </div>

      <div class="control">
        <div class="label-row"><label for="count">Anzahl der Spalte <i>N</i></label><output id="countOut" for="count">5</output></div>
        <input id="count" type="range" min="2" max="20" step="1" value="5">
      </div>
    </section>

    <section>
      <div class="panel main-panel">
        <div class="chart-head">
          <div><h2>Intensität auf dem Schirm</h2></div>
        </div>
        <div class="legend" aria-label="Legende">
          <span class="legend-item"><span class="swatch"></span>Optisches Gitter (N Spalte)</span>
          <span class="legend-item"><span class="swatch envelope"></span>Einzelspalt-Einhüllende</span>
        </div>
        <div class="chart-wrap"><canvas id="chart" role="img" aria-label="Diagramm der normierten Intensität am Schirm mit Gitterkurve und Einzelspalt-Einhüllender."></canvas></div>

      </div>
    </section>
  </main>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('chart');
  const ctx = canvas.getContext('2d');
  const controls = ['width', 'wavelength', 'spacing', 'count'];
  const L = 1.0; // m, fester Schirmabstand
  const colors = { ink: '#26344d', muted: '#708098', grid: '#e7edf5', axis: '#b7c3d3', blue: '#315fe8', orange: '#e28a35', white: '#ffffff' };

  function getParams() {
    return {
      a: Number($('width').value) * 1e-6,
      lambda: Number($('wavelength').value) * 1e-9,
      d: Number($('spacing').value) * 1e-6,
      N: Number($('count').value)
    };
  }
  function sinc(z) { return Math.abs(z) < 1e-8 ? 1 : Math.sin(z) / z; }
  function singleSlit(beta) { const s = sinc(beta); return s * s; }
  function arrayFactor(alpha, N) {
    const nearest = Math.round(alpha / Math.PI);
    if (Math.abs(alpha - nearest * Math.PI) < 1e-7) return 1;
    const den = N * Math.sin(alpha);
    if (Math.abs(den) < 1e-12) return 1;
    const r = Math.sin(N * alpha) / den;
    return r * r;
  }
  function fmt(value, digits = 1) {
    return value.toLocaleString('de-DE', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function tickFmt(v) {
    const abs = Math.abs(v);
    const digits = abs < 10 && Math.abs(v - Math.round(v)) > 0.04 ? 1 : 0;
    if (Math.abs(v) < 1e-7) return '0';
    return v.toLocaleString('de-DE', { maximumFractionDigits: digits });
  }
  function updateLabels() {
    $('widthOut').textContent = fmt(Number($('width').value), Number($('width').value) % 1 ? 1 : 0) + ' µm';
    $('wavelengthOut').textContent = $('wavelength').value + ' nm';
    $('spacingOut').textContent = $('spacing').value + ' µm';
    $('countOut').textContent = $('count').value;
  }
  // Fester Schirmbereich: Änderungen an a und λ verschieben/strecken die Kurven,
  // statt die x-Achse automatisch an die jeweilige Einhüllende anzupassen.
  function getHalfSpan() { return 0.1; } // ±100 mm
  function draw() {
    const p = getParams();
    updateLabels();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const cssW = Math.max(320, canvas.clientWidth);
    const cssH = Math.max(300, canvas.clientHeight);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = colors.white;
    ctx.fillRect(0, 0, cssW, cssH);

    const margin = { left: 60, right: 22, top: 18, bottom: 47 };
    const plotW = cssW - margin.left - margin.right;
    const plotH = cssH - margin.top - margin.bottom;
    if (plotW <= 10 || plotH <= 10) return;
    const halfSpan = getHalfSpan();
    const xmin = -halfSpan * 1000;
    const xmax = halfSpan * 1000;
    const X = (x) => margin.left + (x - xmin) / (xmax - xmin) * plotW;
    const Y = (y) => margin.top + (1.06 - y) / 1.06 * plotH;

    ctx.font = '12px Inter, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    // Horizontal grid and intensity tick labels
    for (let i = 0; i <= 5; i++) {
      const val = i / 5;
      const yy = Y(val);
      ctx.beginPath(); ctx.moveTo(margin.left, yy); ctx.lineTo(cssW - margin.right, yy);
      ctx.strokeStyle = val === 0 ? colors.axis : colors.grid; ctx.lineWidth = val === 0 ? 1.2 : 1; ctx.stroke();
      ctx.fillStyle = colors.muted; ctx.textAlign = 'right'; ctx.fillText(val.toFixed(1).replace('.', ','), margin.left - 11, yy);
    }
    // Vertical grid and x tick labels
    const ticks = 6;
    for (let i = 0; i <= ticks; i++) {
      const xv = xmin + (xmax - xmin) * i / ticks;
      const xx = X(xv);
      ctx.beginPath(); ctx.moveTo(xx, margin.top); ctx.lineTo(xx, margin.top + plotH);
      ctx.strokeStyle = Math.abs(xv) < (xmax - xmin) / ticks * 0.05 ? '#cad5e4' : colors.grid; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = colors.muted; ctx.textAlign = 'center'; ctx.fillText(tickFmt(xv), xx, margin.top + plotH + 18);
    }
    // Axis labels
    ctx.fillStyle = colors.ink; ctx.font = '600 12px Inter, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Position auf dem Schirm x (mm)', margin.left + plotW / 2, cssH - 9);
    ctx.save(); ctx.translate(15, margin.top + plotH / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('Relative Intensität I / I₀', 0, 0); ctx.restore();

    function curve(kind, color, dashed) {
      ctx.beginPath();
      const steps = Math.max(2800, Math.floor(plotW * 7));
      for (let i = 0; i <= steps; i++) {
        const xmm = xmin + (xmax - xmin) * i / steps;
        const x = xmm / 1000;
        const sinTheta = x / Math.sqrt(L * L + x * x);
        const beta = Math.PI * p.a * sinTheta / p.lambda;
        const alpha = Math.PI * p.d * sinTheta / p.lambda;
        const env = singleSlit(beta);
        const y = kind === 'envelope' ? env : env * arrayFactor(alpha, p.N);
        const xx = X(xmm), yy = Y(Math.max(0, Math.min(1.03, y)));
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.strokeStyle = color; ctx.lineWidth = kind === 'grating' ? 2.15 : 2.05;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.setLineDash(dashed ? [7, 5] : []); ctx.stroke(); ctx.setLineDash([]);
    }
    // Envelope first, grating second so the blue curve is visible over it.
    curve('envelope', colors.orange, true);
    curve('grating', colors.blue, false);
    // Center line
    ctx.beginPath(); ctx.moveTo(X(0), margin.top); ctx.lineTo(X(0), margin.top + plotH);
    ctx.strokeStyle = '#b7c4d8'; ctx.lineWidth = 1; ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);

  }

  controls.forEach(id => $(id).addEventListener('input', draw));
  if ('ResizeObserver' in window) new ResizeObserver(draw).observe(canvas);
  else window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
